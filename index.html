<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>EstudioRender</title>
  <meta name="theme-color" content="#1f1f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EstudioRender">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Volver" hidden>&#8592;</button>
    <h1 id="title">EstudioRender</h1>
    <nav class="tabs" id="tabs" hidden>
      <button data-tab="ficha">Ficha</button>
      <button data-tab="plano">Plano</button>
      <button data-tab="render">Renders</button>
      <button data-tab="video">Vídeo</button>
    </nav>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">&#9881;</button>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
